# SSD1306
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_EXT_POWER=y

# Enable nice!oled
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_EPAPER_ON=n
CONFIG_NICE_CUSTOM_ON=n

# LVGL 9 needs more stack in the display thread than LVGL 8 (3784 bytes measured; ZMK gives 3072).
# It has to be set here: ZMK defines this option before the shield defaults are read.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
